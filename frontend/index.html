<!DOCTYPE html>
<html>


<head>
    <title>Pulse // Student Results</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --ink: #17252b;
            --paper: #f6f4ef;
            --accent: #d6b56d;
            --accent-soft: #e8dcc2;
            --teal: #8fc5bd;
            --muted: #657277;
            --line: rgba(23, 37, 43, 0.16);
            --shadow: 8px 8px 0 #c8d7d3;
            --ease-out: cubic-bezier(.16, 1, .3, 1);
        }

        * { box-sizing: border-box; }

        ::selection { color: var(--paper); background: var(--ink); }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--paper);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .4;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black 0%, transparent 78%);
        }

        .shell { width: min(1100px, calc(100% - 40px)); margin: auto; padding: 28px 0 80px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; background: var(--ink); color: var(--accent); font-size: 18px; transform: rotate(-8deg); transition: transform .35s var(--ease-out); }
        .brand:hover .brand-mark { transform: rotate(8deg) scale(1.08); }
        .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 12px 'DM Mono', monospace; text-transform: uppercase; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #29bd72; box-shadow: 0 0 0 4px rgba(41, 189, 114, .18); }

        .hero { padding: 76px 0 48px; max-width: 820px; animation: rise .7s ease both; }
        .eyebrow { margin: 0 0 16px; color: #9a7633; font: 500 13px 'DM Mono', monospace; letter-spacing: .15em; text-transform: uppercase; }
        h1 { margin: 0; max-width: 780px; font-size: clamp(3.7rem, 10vw, 8.8rem); line-height: .84; letter-spacing: -.09em; text-transform: uppercase; }
        h1 em { color: #9a7633; font-style: normal; }
        .hero-copy { max-width: 510px; margin: 30px 0 0; color: var(--muted); font-size: 1.1rem; line-height: 1.5; }

        .search-panel { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; padding: 24px; background: var(--accent-soft); border: 2px solid var(--ink); box-shadow: var(--shadow); animation: rise .7s .12s ease both; transition: box-shadow .25s var(--ease-out), transform .25s var(--ease-out); }
        .search-panel:focus-within { box-shadow: 12px 12px 0 var(--accent); transform: translate(-2px, -2px); }
        .field-label { display: block; margin-bottom: 9px; font: 500 12px 'DM Mono', monospace; text-transform: uppercase; }
        input { width: 100%; border: 0; border-bottom: 3px solid var(--ink); outline: 0; padding: 12px 0 10px; color: var(--ink); background: transparent; font: 600 1.4rem 'Space Grotesk', sans-serif; }
        input::placeholder { color: rgba(23, 37, 43, .48); }
        input:focus { border-color: var(--accent); }
        input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
        button { min-height: 52px; border: 2px solid var(--ink); box-shadow: none; padding: 0 24px; cursor: pointer; color: var(--paper); background: var(--ink); font: 600 14px 'DM Mono', monospace; text-transform: uppercase; transition: transform .18s var(--ease-out), background .18s, color .18s; }
        button:hover { color: var(--ink); background: var(--accent); transform: translate(-3px, -3px); }
        button:disabled { cursor: wait; opacity: .6; }

        #result { min-height: 180px; margin-top: 52px; animation: rise .7s .22s ease both; }
        .empty { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; border-top: 2px solid var(--ink); padding-top: 24px; color: var(--muted); }
        .empty-number { color: #9a7633; font: 500 12px 'DM Mono', monospace; }
        .student-card { border: 2px solid var(--ink); background: rgba(255, 255, 255, .43); box-shadow: var(--shadow); animation: reveal .6s var(--ease-out) both; }
        .student-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; padding: 28px; border-bottom: 2px solid var(--ink); background: var(--teal); }
        .student-head h2 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -.06em; line-height: .9; text-transform: uppercase; }
        .student-id { padding-top: 5px; color: var(--muted); font: 12px 'DM Mono', monospace; text-align: right; }
        .student-id strong { display: block; margin-top: 5px; color: var(--ink); font-size: 16px; }
        .meta { display: flex; gap: 12px; flex-wrap: wrap; padding: 18px 28px; border-bottom: 1px solid var(--line); font: 13px 'DM Mono', monospace; text-transform: uppercase; }
        .meta span { padding: 7px 10px; border: 1px solid var(--ink); background: var(--paper); }
        table { width: 100%; border-collapse: collapse; font-family: 'DM Mono', monospace; }
        th, td { padding: 16px 28px; border-bottom: 1px solid var(--line); text-align: left; }
        th { color: var(--muted); font-size: 11px; font-weight: 400; text-transform: uppercase; }
        td:last-child { color: #9a7633; font-weight: 500; text-align: right; }
        tbody tr { transition: background .2s ease, transform .2s var(--ease-out); }
        tbody tr:hover { background: rgba(143, 197, 189, .22); transform: translateX(5px); }
        tr:last-child td { border-bottom: 0; }
        .not-found, .error { border: 2px solid var(--ink); padding: 24px; background: #ead8b6; font: 500 15px 'DM Mono', monospace; }
        .loading { color: var(--muted); font: 13px 'DM Mono', monospace; }
        .footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 64px; color: var(--muted); font: 11px 'DM Mono', monospace; text-transform: uppercase; }

        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes reveal { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
        @media (max-width: 620px) {
            .shell { width: min(100% - 28px, 1100px); padding-top: 18px; }
            .status { display: none; }
            .hero { padding: 58px 0 36px; }
            h1 { font-size: clamp(3.3rem, 18vw, 6rem); }
            .search-panel { grid-template-columns: 1fr; padding: 18px; }
            button { width: 100%; }
            .student-head { display: block; padding: 22px; }
            .student-id { padding-top: 18px; text-align: left; }
            .meta { padding: 14px 22px; }
            th, td { padding: 14px 22px; }
            .footer { display: block; line-height: 2; }
        }
    </style>
    </head>
    <body>
        <main class="shell">
            <header class="topbar">
                <div class="brand"><span class="brand-mark">S</span><span>Student Result Portal</span></div>
                <div class="status"><span class="status-dot"></span> Live records interface</div>
            </header>

            <section class="hero">
                <p class="eyebrow">Student intelligence / 001</p>
                <h1>Find your<br><em>result.</em></h1>
                <p class="hero-copy">Search the live academic records and pull a clean snapshot of your performance.</p>
            </section>

            <form class="search-panel" id="searchForm">
                <label>
                    <span class="field-label">Register number</span>
                    <input type="text" id="register_number" placeholder="e.g. 2024CS001" autocomplete="off" required>
                </label>
                <button type="submit" id="searchButton">Run search <span aria-hidden="true">↗</span></button>
            </form>

            <section id="result" aria-live="polite">
                <div class="empty"><span class="empty-number">Awaiting input</span><span>Enter a register number to reveal a result profile.</span></div>
            </section>

            <footer class="footer"><span>Data stream // /results</span><span>Built for the next grade</span></footer>
        </main>

        <script>
            const form = document.getElementById('searchForm');
            const input = document.getElementById('register_number');
            const result = document.getElementById('result');
            const button = document.getElementById('searchButton');

            form.addEventListener('submit', searchResult);

            async function searchResult(event) {
                event.preventDefault();
                const registerNumber = input.value.trim();
                if (!registerNumber) return;

                button.disabled = true;
                result.innerHTML = '<p class="loading">Connecting to records...</p>';

                try {
                    const response = await fetch('http://127.0.0.1:8000/results');
                    if (!response.ok) throw new Error(`Server returned ${response.status}`);
                    const students = await response.json();
                    const student = students.find(item => String(item.register_number).toLowerCase() === registerNumber.toLowerCase());

                    if (!student) {
                        result.innerHTML = '<div class="not-found">No record found // Check the register number and try again.</div>';
                        return;
                    }

                    const rows = student.subjects.map(subject => `<tr><td>${subject.subject_name}</td><td>${subject.grade}</td></tr>`).join('');
                    result.innerHTML = `
                        <article class="student-card">
                            <div class="student-head">
                                <h2>${student.student_name}</h2>
                                <div class="student-id">Register number<strong>${student.register_number}</strong></div>
                            </div>
                            <div class="meta"><span>Department / ${student.department}</span><span>Subjects / ${student.subjects.length}</span></div>
                            <table><thead><tr><th>Subject</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table>
                        </article>`;
                } catch (error) {
                    result.innerHTML = `<div class="error">Connection failed // ${error.message}. Make sure the FastAPI server is running.</div>`;
                } finally {
                    button.disabled = false;
                }
            }
        </script>
    </body>
</html>
